<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="100%" height="100%">
  <style>
    .bg { fill: #111317; }
    .cutline { fill: none; stroke: #ef4444; stroke-width: 1.2; } /* Red for laser cut */
    .kerf { fill: none; stroke: #3b82f6; stroke-width: 0.8; } /* Blue for laser score / kerf */
    .engrave { fill: none; stroke: #10b981; stroke-width: 0.8; stroke-dasharray: 4,4; }
    .dim { fill: #9ca3af; font-family: monospace; font-size: 11px; }
    .title { fill: #f3f4f6; font-family: sans-serif; font-size: 15px; font-weight: bold; }
    .subtitle { fill: #fbbf24; font-family: monospace; font-size: 12px; }
  </style>

  <!-- Background -->
  <rect class="bg" width="1000" height="350" rx="8" />

  <!-- Sheet Title & Metadata -->
  <text x="30" y="38" class="title">STRATAVOX // FABRICATION CUT SHEET: PRIMARY SCISSOR LAMELLA</text>
  <text x="30" y="58" class="subtitle">MATERIAL: 3.5mm FINNISH AIRCRAFT BIRCH (5-PLY) | SCALE 1:1 CNC/LASER VECTOR</text>

  <!-- Outer Lamella Boundary (820mm x 65mm profile scaled) -->
  <g transform="translate(60, 110)">
    <!-- Main Outer Contour with Filleted Ends -->
    <rect class="cutline" x="0" y="0" width="860" height="90" rx="45" />

    <!-- Left Inner Pivot Hole (Ø 6.0mm for flanged bronze bushing) -->
    <circle class="cutline" cx="45" cy="45" r="9" />
    <circle class="engrave" cx="45" cy="45" r="14" />
    <text x="25" y="75" class="dim">Ø 6.0</text>

    <!-- Center Pivot Hole (Scissor Cross-Axis) -->
    <circle class="cutline" cx="430" cy="45" r="9" />
    <circle class="engrave" cx="430" cy="45" r="14" />
    <text x="415" y="75" class="dim">Ø 6.0</text>

    <!-- Right Outer Pivot Hole (Perimeter Auxetic Node) -->
    <circle class="cutline" cx="815" cy="45" r="9" />
    <circle class="engrave" cx="815" cy="45" r="14" />
    <text x="795" y="75" class="dim">Ø 6.0</text>

    <!-- Neutral Axis Wire Harness Routing Slot (Zero-Strain Channel) -->
    <path class="cutline" d="M 90,42 L 375,42 A 3,3 0 0,1 375,48 L 90,48 A 3,3 0 0,1 90,42 Z" />
    <path class="cutline" d="M 485,42 L 770,42 A 3,3 0 0,1 770,48 L 485,48 A 3,3 0 0,1 485,42 Z" />
    <text x="200" y="35" class="dim">NEUTRAL AXIS CONDUCTOR CHANNEL (6mm)</text>

    <!-- Progressive Kerf-Cut Living Hinge Zones (Permitting 3D Saddle Twist) -->
    <!-- Zone 1 -->
    <g class="kerf">
      <line x1="260" y1="6" x2="260" y2="35" />
      <line x1="260" y1="55" x2="260" y2="84" />
      <line x1="270" y1="12" x2="270" y2="78" />
      <line x1="280" y1="6" x2="280" y2="35" />
      <line x1="280" y1="55" x2="280" y2="84" />
      <line x1="290" y1="12" x2="290" y2="78" />
      <line x1="300" y1="6" x2="300" y2="35" />
      <line x1="300" y1="55" x2="300" y2="84" />
      <line x1="310" y1="12" x2="310" y2="78" />
      <line x1="320" y1="6" x2="320" y2="35" />
      <line x1="320" y1="55" x2="320" y2="84" />
    </g>

    <!-- Zone 2 -->
    <g class="kerf">
      <line x1="600" y1="6" x2="600" y2="35" />
      <line x1="600" y1="55" x2="600" y2="84" />
      <line x1="610" y1="12" x2="610" y2="78" />
      <line x1="620" y1="6" x2="620" y2="35" />
      <line x1="620" y1="55" x2="620" y2="84" />
      <line x1="630" y1="12" x2="630" y2="78" />
      <line x1="640" y1="6" x2="640" y2="35" />
      <line x1="640" y1="55" x2="640" y2="84" />
      <line x1="650" y1="12" x2="650" y2="78" />
      <line x1="660" y1="6" x2="660" y2="35" />
      <line x1="660" y1="55" x2="660" y2="84" />
    </g>

    <!-- Dimension Callouts -->
    <text x="270" y="105" class="dim">KERF COMPLIANCE ZONE A</text>
    <text x="610" y="105" class="dim">KERF COMPLIANCE ZONE B</text>
  </g>

  <!-- Legend -->
  <g transform="translate(60, 290)">
    <line x1="0" y1="10" x2="40" y2="10" class="cutline" />
    <text x="50" y="14" class="dim">RED: Through Cut (Vector)</text>

    <line x1="240" y1="10" x2="280" y2="10" class="kerf" />
    <text x="290" y="14" class="dim">BLUE: Kerf Hinge Flexure Cut</text>

    <line x1="530" y1="10" x2="570" y2="10" class="engrave" />
    <text x="580" y="14" class="dim">GREEN: Alignment Reference Marking</text>
  </g>
</svg>
